services:
  postgres:
    image: postgres:18-alpine
    container_name: zombie-playa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zombie_playa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
